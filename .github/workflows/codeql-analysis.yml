name: CodeQL

# Heredado del original (2020, codeql-action@v1, ya retirado). Puesto al dia:
# mismo proposito, acciones vigentes, y sin correr en cada push de docs.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'media/**']
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
